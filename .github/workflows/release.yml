name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            publish:
                description: Publish to npm after a successful build
                type: boolean
                default: false

permissions:
    contents: read
    id-token: write

jobs:
    prepare:
        name: Prepare matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - id: set-matrix
              run: echo "matrix=$(node scripts/ci-matrix.js)" >> "$GITHUB_OUTPUT"

    build:
        name: Build ${{ matrix.target }}
        needs: prepare
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Use Node.js 26
              if: ${{ !matrix.docker && matrix.arch }}
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  architecture: ${{ matrix.arch }}

            - name: Use Node.js 26
              if: ${{ !matrix.docker && !matrix.arch }}
              uses: actions/setup-node@v7
              with:
                  node-version: '26'

            - name: Install dependencies
              if: ${{ !matrix.docker }}
              run: npm install --ignore-scripts

            - name: Build native module
              if: ${{ !matrix.docker }}
              run: npm run build

            - name: Build native module in Docker
              if: matrix.docker
              run: |
                  docker run --rm \
                    -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
                    -w "$GITHUB_WORKSPACE" \
                    "${{ matrix.docker }}" \
                    sh -c "${{ matrix.install_deps }} && npm install --ignore-scripts && npm run build && node scripts/rename-artifact.js ${{ matrix.target }}"

            - name: Rename artifact
              if: ${{ !matrix.docker }}
              run: node scripts/rename-artifact.js ${{ matrix.target }}

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: bindings-${{ matrix.target }}
                  path: sax-parser.${{ matrix.target }}.node
                  if-no-files-found: error

    publish:
        name: Publish to npm
        needs: build
        if: >
            success() &&
            (
              (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
              (github.event_name == 'workflow_dispatch' && inputs.publish)
            )
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Use Node.js 26
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  registry-url: https://registry.npmjs.org

            - name: Set version from tag
              if: github.event_name == 'push'
              run: npm version "${GITHUB_REF#refs/tags/v}" --no-git-tag-version --allow-same-version

            - name: Install dependencies
              run: npm install --ignore-scripts

            - name: Create platform package directories
              run: npm run create-npm-dirs

            - name: Download native artifacts
              uses: actions/download-artifact@v8
              with:
                  path: artifacts

            - name: Collect native artifacts
              run: npm run artifacts
              env:
                  STRICT: '1'

            - name: List platform packages
              run: ls -R npm

            - name: Publish platform packages
              run: node scripts/prepublish.js

            - name: Publish root package
              run: npm publish --access public --ignore-scripts

            - name: Create GitHub Release
              if: github.event_name == 'push'
              uses: softprops/action-gh-release@v2
              with:
                  files: npm/*/*.node
                  generate_release_notes: true
                  fail_on_unmatched_files: true
