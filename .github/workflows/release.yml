name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: write
    id-token: write

jobs:
    build:
        name: Build ${{ matrix.target }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: darwin-x64
                      os: macos-latest
                      arch: x64
                    - target: darwin-arm64
                      os: macos-latest
                      arch: arm64
                    - target: win32-x64
                      os: windows-latest
                      arch: x64
                    - target: win32-arm64
                      os: windows-11-arm
                      arch: arm64
                    - target: linux-x64-gnu
                      os: ubuntu-latest
                    - target: linux-x64-musl
                      os: ubuntu-latest
                      container: node:22-alpine
                      install_deps: apk add --no-cache python3 make g++
                    - target: linux-arm64-gnu
                      os: ubuntu-24.04-arm
                    - target: linux-arm64-musl
                      os: ubuntu-24.04-arm
                      container: node:22-alpine
                      install_deps: apk add --no-cache python3 make g++
        runs-on: ${{ matrix.os }}
        container: ${{ matrix.container || null }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Install build dependencies
              if: matrix.install_deps
              run: ${{ matrix.install_deps }}

            - name: Use Node.js 22
              if: matrix.arch
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  architecture: ${{ matrix.arch }}

            - name: Use Node.js 22
              if: ${{ !matrix.arch }}
              uses: actions/setup-node@v7
              with:
                  node-version: '22'

            - name: Install dependencies
              run: npm install --ignore-scripts

            - name: Build native module
              run: npm run build

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: bindings-${{ matrix.target }}
                  path: build/Release/sax_parser.node
                  if-no-files-found: error

    publish:
        name: Publish to npm
        needs: build
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Use Node.js 26
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
                  registry-url: https://registry.npmjs.org

            - name: Set version from tag
              run: npm version "${GITHUB_REF#refs/tags/v}" --no-git-tag-version --allow-same-version

            - name: Install dependencies
              run: npm install --ignore-scripts

            - name: Create platform package directories
              run: npm run create-npm-dirs

            - name: Download native artifacts
              uses: actions/download-artifact@v8
              with:
                  path: artifacts

            - name: Collect native artifacts
              run: npm run artifacts
              env:
                  STRICT: '1'

            - name: List platform packages
              run: ls -R npm

            - name: Publish platform packages
              run: node scripts/prepublish.js
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: 'true'

            - name: Publish root package
              run: npm publish --access public --ignore-scripts
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: 'true'

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: npm/*/sax_parser.node
                  generate_release_notes: true
                  fail_on_unmatched_files: true
